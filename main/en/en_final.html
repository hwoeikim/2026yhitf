<!-- 2026 YHITF EN 메인 · FINAL (국문 FINAL 위젯 영문판, 2026-10-19) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&display=swap">
<style>
.yh{
  --ink:#0A0A0B; --ink2:#141416; --paper:#F4F3EF; --mute:#9A9BA2;
  --blue:#002ACF; --orange:#FF6D07;
  --en:"Archivo","Arial Narrow",sans-serif;
  --ko:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --max:1440px; --m:clamp(20px,4.4vw,72px); --gut:clamp(12px,1.7vw,24px);
  --t-body:clamp(16px,1.15vw,18px); --t-lead:clamp(18px,1.5vw,22px); --t-h3:clamp(24px,2.4vw,36px); --t-h2:clamp(32px,4.2vw,64px);
  --sp:clamp(96px,12vw,200px);
  --x:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.77,0,.18,1);
  position:relative; overflow-x:clip; background:var(--ink); color:var(--paper); font-family:var(--ko); font-size:var(--t-body); line-height:1.6;
  word-break:keep-all; -webkit-font-smoothing:antialiased; color-scheme:dark;
}
.yh *{box-sizing:border-box;margin:0;padding:0}
.yh a{color:inherit;text-decoration:none}
.yh img{display:block;max-width:100%}
.yh .w{width:min(var(--max),100%);margin-inline:auto;padding-inline:var(--m)}
.yh .g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut)}
.yh .en{font-family:var(--en);font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.84}
.yh .btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:60px;padding:0 34px;font-family:var(--ko);font-weight:700;font-size:17px;border-radius:999px;transition:background .3s var(--x),color .3s var(--x),transform .3s var(--x)}
.yh .btn.o{background:var(--orange);color:#fff}
.yh .btn.o:hover{transform:translateY(-3px)}
.yh .btn.w2{background:var(--paper);color:var(--ink)}
.yh .btn.t{height:auto;padding:0;font-size:var(--t-lead);color:var(--paper)}
.yh .btn.t:hover{color:var(--orange)}
.yh .btn:focus-visible{outline:2px solid var(--orange);outline-offset:4px}
.yh .rv{opacity:0;transform:translateY(40px);transition:opacity .8s var(--x),transform 1s var(--x)}
.yh .rv.in{opacity:1;transform:none}
/* ===== 7. FINAL ===== */
#yh-fin{min-height:100vh;display:flex;align-items:flex-end;padding-block:var(--sp) clamp(48px,6vw,88px);overflow:hidden;isolation:isolate}
#yh-fin .bg{position:absolute;inset:0;z-index:-1}
#yh-fin .bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
#yh-fin .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,11,.15) 0%,rgba(10,10,11,.35) 45%,rgba(10,10,11,.92) 100%)}
#yh-fin .w{width:min(var(--max),100%)}
#yh-fin .ko{grid-column:1/9;font-size:var(--t-h3);font-weight:800;line-height:1.4;letter-spacing:-.03em}
#yh-fin .ko em{font-style:normal;color:var(--orange)}
#yh-fin .dec{grid-column:1/13;margin-top:clamp(40px,5vw,72px);font-size:15.2vw;line-height:.8;white-space:nowrap}
#yh-fin .dt{grid-column:1/13;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:clamp(10px,1.2vw,18px)}
#yh-fin .dt .en{font-size:clamp(46px,7.4vw,124px)}
#yh-fin .dt .ex{display:inline-block;margin-left:.6em;font-size:clamp(26px,2.6vw,42px);line-height:1;color:#D3D3D6;white-space:nowrap}
#yh-fin .dt .loc{margin-top:clamp(14px,1.4vw,22px);font-size:clamp(34px,3.6vw,60px);line-height:1;color:#D3D3D6}
#yh-fin .dt .ex b{color:var(--orange);font-weight:800}
#yh-fin .btn.o{height:72px;padding:0 48px;font-size:19px}

@media (max-width:820px){
  #yh-fin .ko{grid-column:1/13}
}
@media (prefers-reduced-motion:reduce){ #yh-fin *{transition:none!important;animation:none!important} #yh-fin .rv{opacity:1!important;transform:none!important} }

/* 모바일: 리드 문구 3줄 위계 + EXPO 좌측 정렬 */
#yh-fin .ko .mbr{display:none}
@media (max-width:820px){
#yh-fin .ko{font-size:clamp(23px,6.6vw,31px);line-height:1.28;letter-spacing:-.045em}
#yh-fin .ko .ko-eb{display:inline-block;margin-bottom:10px;font-size:15px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
#yh-fin .ko .mbr{display:inline}
#yh-fin .dt .ex{display:block;margin-left:0;margin-top:10px}
}
</style>
