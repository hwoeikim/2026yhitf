<!-- ===== YHITF · THE INVITED (엘리트 초청 페이지, 코드 위젯 1개) =====
     국문·영문 사이트 공용: 사이트 언어(html lang)를 보고 KR/EN 문구를 자동으로 고릅니다.
     이미지: GitHub(jsDelivr CDN) 068a47e 버전. 섹션 설정: 상하·좌우 여백 0, 기본 그리드 간격 끔, 가로 100% 확장. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 1 blue hero: image grid + condensed wordmark → 2 sticky dot map: world → frame on Korea → zoom to Hanam → invitation quote → logos
   3 key visual → criteria (ITRA index + scores; EN tiers switch the benefit block) → 4 steps with filling rail → 5 finale poster */
#yh-inv{
  --blue:#002ACF; --orange:#FF6D07; --white:#FFFFFF; --ink:#212121; --gray:#999999; --line:#EAEAEA;
  --kr:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --hook:"Black Han Sans","Noto Sans KR",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --margin:clamp(16px,4vw,48px);
  --s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;--s9:160px;
  color-scheme:light;
}
#yh-inv,#yh-inv *{box-sizing:border-box;margin:0;padding:0}
#yh-inv{background:var(--white);color:var(--ink);font-family:var(--kr);letter-spacing:-.03em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
#yh-inv .gut{padding-left:max(var(--margin),env(safe-area-inset-left,0px));padding-right:max(var(--margin),env(safe-area-inset-right,0px))}
#yh-inv .wide{max-width:1400px;margin:0 auto}
#yh-inv a{color:inherit}
#yh-inv :focus-visible{outline:3px solid var(--orange);outline-offset:3px}
#yh-inv .en{font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:62%;font-variation-settings:"wdth" 62;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.88}
#yh-inv .ph{position:relative;overflow:hidden;background:var(--line)}
#yh-inv .ph>i{position:absolute;left:14px;bottom:12px;right:14px;font-style:normal;font-size:12px;line-height:1.45;color:var(--gray);font-weight:500}
#yh-inv .dark .ph{background:rgba(255,255,255,.07)}
#yh-inv .dark .ph>i{color:rgba(255,255,255,.4)}


/* 1 hero — five photos slide in from different sides, then THE INVITED. lifts over them */
#yh-inv .hero{background:var(--blue);color:var(--white);padding-block:var(--s7);position:relative;overflow:hidden}
#yh-inv .grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(58px,6.6vw,100px);gap:var(--s3)}
#yh-inv .tile{position:relative;overflow:hidden;background:rgba(255,255,255,.1)}
#yh-inv .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#yh-inv .p-face{grid-column:1/5;grid-row:1/6}#yh-inv .p-face img{object-position:62% 40%}
#yh-inv .p-mtn{grid-column:5/10;grid-row:1/4}#yh-inv .p-mtn img{object-position:38% 62%}
#yh-inv .p-hand{grid-column:10/13;grid-row:1/3}#yh-inv .p-hand img{object-position:40% 42%}
#yh-inv .p-legs{grid-column:10/13;grid-row:3/6}#yh-inv .p-legs img{object-position:45% 55%}
#yh-inv .p-group{grid-column:5/10;grid-row:4/6}#yh-inv .p-group img{object-position:50% 42%}
#yh-inv .word{position:relative;z-index:2;margin-top:-.6em;font-size:clamp(92px,19.6vw,300px);white-space:nowrap;pointer-events:none;letter-spacing:-.015em}
#yh-inv .word .w{display:inline-block;position:relative}
#yh-inv .word .w+.w{margin-left:.14em}
#yh-inv .dot{display:inline-block;width:.15em;height:.15em;margin-left:.04em;border-radius:50%;background:var(--orange);vertical-align:baseline}
#yh-inv .lede{margin-top:var(--s6)}
#yh-inv .lede .kr strong{display:block;font-weight:900;font-size:clamp(20px,1.9vw,28px);letter-spacing:-.055em;line-height:1.35}
#yh-inv .lede .kr span{display:block;margin-top:10px;font-size:clamp(26px,3vw,46px);line-height:1.2;font-weight:900;letter-spacing:-.055em;color:var(--orange)}

#yh-inv .p-mtn{--d:.2s}#yh-inv .p-face{--d:.36s}#yh-inv .p-hand{--d:.52s}#yh-inv .p-group{--d:.68s}#yh-inv .p-legs{--d:.82s}
#yh-inv.js .from-l{clip-path:inset(0 100% 0 0)}#yh-inv.js .from-l img{transform:translateX(-14%) scale(1.12)}
#yh-inv.js .from-r{clip-path:inset(0 0 0 100%)}#yh-inv.js .from-r img{transform:translateX(14%) scale(1.12)}
#yh-inv.js .from-b{clip-path:inset(100% 0 0 0)}#yh-inv.js .from-b img{transform:translateY(14%) scale(1.12)}
#yh-inv.js .from-t{clip-path:inset(0 0 100% 0)}#yh-inv.js .from-t img{transform:translateY(-14%) scale(1.12)}
#yh-inv.play .tile{animation:yhi-reveal .8s var(--ease) var(--d) forwards,yhi-dim 1s var(--ease) 1.3s forwards}
#yh-inv.play .tile img{animation:yhi-settle 1.1s var(--ease) var(--d) forwards}
#yh-inv.play .p-legs{animation-duration:.5s,1s}#yh-inv.play .p-legs img{animation-duration:.7s}
#yh-inv.play .grid{animation:yhi-recede 1.2s var(--ease) 1.3s forwards}
@keyframes yhi-reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes yhi-settle{to{transform:none}}
@keyframes yhi-dim{to{filter:brightness(.66)}}
@keyframes yhi-recede{to{transform:scale(.975)}}
#yh-inv.js .word .w{clip-path:inset(0 0 100% 0);transform:translateY(22%)}
#yh-inv.js .lede{opacity:0}
#yh-inv.play .word .w{animation:yhi-lift 1.2s var(--ease) 1.25s forwards}
#yh-inv.play .word .w+.w{animation-delay:1.36s}
#yh-inv.play .lede{animation:yhi-up 1s var(--ease) 1.75s forwards}
@keyframes yhi-lift{to{clip-path:inset(-10% -10% -12% -10%);transform:none}}
@keyframes yhi-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 2 map + invitation */
#yh-inv .letter{position:relative;height:340vh;background:var(--white)}
#yh-inv .letter .stick{position:sticky;top:0;height:100vh;overflow:hidden}
#yh-inv #globe{position:absolute;inset:0;width:100%;height:100%}
#yh-inv .note{position:absolute;left:0;right:0;top:0;padding:13vh var(--margin) 10vh;text-align:center;background:linear-gradient(#fff 62%,rgba(255,255,255,0))}
#yh-inv .note q{display:block;quotes:none;font-weight:900;font-size:clamp(26px,3.6vw,52px);line-height:1.3;letter-spacing:-.065em;text-wrap:balance}
#yh-inv .note q em{font-style:normal;color:var(--orange)}
#yh-inv .note q.en{font-size:clamp(40px,6vw,92px);line-height:.92;letter-spacing:-.005em}
#yh-inv .marq{padding-block:var(--s7)}
#yh-inv .marq .track{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
#yh-inv .marq .row{display:flex;gap:var(--s7);width:max-content;animation:yhi-roll 38s linear infinite}
#yh-inv .marq{--unit:34px}
#yh-inv .marq .row{align-items:center}
#yh-inv .marq .logo{height:calc(var(--unit) * var(--h));width:calc(var(--unit) * var(--h) * var(--r));flex:none}
#yh-inv .marq .logo img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes yhi-roll{to{transform:translateX(-50%)}}

/* 3 key visual */
#yh-inv .kv{position:relative;background:var(--ink);color:var(--white)}
#yh-inv .kv .ph{height:min(88vh,840px);background:#C9D0D8}
#yh-inv .kv .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 34%;display:block}
#yh-inv .kv h2{position:absolute;left:0;right:0;top:8vh;color:var(--white);font-size:clamp(64px,9.2vw,168px)}
#yh-inv .kv h2 span{display:block;overflow:hidden;padding-bottom:.04em}
#yh-inv .kv h2 em{display:block;font-style:normal}
#yh-inv.js .kv h2 em{transform:translateY(105%)}
#yh-inv .kv.in h2 em{transform:none;transition:transform 1.1s var(--ease)}
#yh-inv .kv.in h2 span+span em{transition-delay:.12s}#yh-inv .kv.in h2 span+span+span em{transition-delay:.24s}
#yh-inv.js .kv .ph{clip-path:inset(10% 5% 10% 5%)}
#yh-inv .kv.in .ph{clip-path:inset(0);transition:clip-path 1.4s var(--ease)}

/* criteria */
#yh-inv .crit{background:var(--blue);color:var(--white);padding-block:var(--s8) var(--s9)}
#yh-inv .c-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--s6);align-items:start}
#yh-inv .c-l h3{font-size:clamp(18px,1.5vw,22px);font-weight:700;letter-spacing:-.045em}
#yh-inv .c-l .idx{margin-top:var(--s4);font-size:clamp(64px,8vw,128px);color:var(--orange)}
#yh-inv .c-l p.d{margin-top:var(--s4);font-size:clamp(16px,1.3vw,19px);line-height:1.75;color:rgba(255,255,255,.82)}
#yh-inv .scores{display:grid}
#yh-inv .scores .hd,#yh-inv .srow{display:grid;grid-template-columns:var(--sc-cols);align-items:end;column-gap:var(--s5)}
#yh-inv .scores .hd{padding-bottom:var(--s3);font-size:clamp(15px,1.2vw,18px);font-weight:700}
#yh-inv .scores .hd span:first-child:empty{display:block}
#yh-inv .srow{all:unset;display:grid;grid-template-columns:var(--sc-cols);align-items:center;column-gap:var(--s5);padding-block:6px;cursor:default}
#yh-inv .multi .srow{cursor:pointer;border-top:1px solid rgba(255,255,255,.14);padding-block:var(--s3)}
#yh-inv .multi .srow:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
#yh-inv .srow .tn{font-size:clamp(28px,2.6vw,40px)}
#yh-inv .srow .tn small{display:block;margin-top:8px;font:500 13px/1.3 var(--kr);text-transform:none;letter-spacing:0;color:var(--gray)}
#yh-inv .srow .n{font-size:clamp(84px,10vw,160px);color:var(--orange);transition:color .35s var(--ease),transform .5s var(--ease);transform-origin:left bottom}
#yh-inv .multi .srow .n{font-size:clamp(56px,6.2vw,104px)}
#yh-inv .multi .srow:not([aria-pressed="true"]) .n{color:rgba(255,255,255,.22)}
#yh-inv .multi .srow:not([aria-pressed="true"]) .tn{color:rgba(255,255,255,.4)}
#yh-inv .multi .srow:not([aria-pressed="true"]):hover .n{color:rgba(255,255,255,.5)}
#yh-inv .multi .srow .tn{transition:color .35s var(--ease)}
#yh-inv .c-bot{margin-top:var(--s8);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--s6);align-items:center}
#yh-inv .c-img{aspect-ratio:4/5;max-height:86vh;border-radius:2px;background:#000}
#yh-inv .c-img img,#yh-inv .c-img .shine{position:absolute;inset:0;width:100%;height:100%}
#yh-inv .c-img img{object-fit:cover;object-position:50% 46%;display:block}
/* one band of light slides down the woven ribbon as the section scrolls; the photo itself is the mask, so the black backdrop never lights yhi-up */
#yh-inv .c-img .shine{--p:-.3;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(172deg,transparent calc((var(--p) - .13) * 100%),rgba(255,240,226,.9) calc(var(--p) * 100%),transparent calc((var(--p) + .13) * 100%));
  -webkit-mask:url(https://cdn.jsdelivr.net/gh/hwoeikim/2026yhitf@068a47eb9e1fad31d47b9f93389bfc74b0da89b0/elite/proto/img/ribbon.jpg) 50% 46%/cover no-repeat;mask:url(https://cdn.jsdelivr.net/gh/hwoeikim/2026yhitf@068a47eb9e1fad31d47b9f93389bfc74b0da89b0/elite/proto/img/ribbon.jpg) 50% 46%/cover no-repeat luminance}
#yh-inv .ben h4{font-size:clamp(17px,1.4vw,20px);font-weight:700;letter-spacing:-.045em;color:var(--orange)}
#yh-inv .ben .big{margin-top:var(--s3);font-weight:900;font-size:clamp(34px,3.4vw,54px);letter-spacing:-.065em;line-height:1.15}
#yh-inv .ben .big em{font-style:normal;color:var(--orange)}
#yh-inv .ben .lines{margin-top:var(--s4);display:grid;gap:.06em}
#yh-inv .ben .lines span{display:block;font-size:clamp(52px,6vw,100px);overflow:hidden}
#yh-inv .ben .lines span b{display:block;font-weight:inherit}
#yh-inv .ben .lines span:first-child b{color:var(--orange)}
#yh-inv .ben p{margin-top:var(--s5);font-size:clamp(16px,1.3vw,19px);line-height:1.75;color:rgba(255,255,255,.82);max-width:34em}
#yh-inv .swap .lines b{animation:yhi-rise .6s var(--ease) both}
#yh-inv .swap .lines span:nth-child(2) b{animation-delay:.06s}#yh-inv .swap .lines span:nth-child(3) b{animation-delay:.12s}
#yh-inv .swap p{animation:yhi-up .6s var(--ease) .1s both}
@keyframes yhi-rise{from{transform:translateY(100%)}to{transform:none}}

/* 4 process */
#yh-inv .proc{background:var(--line);padding-block:var(--s9)}
#yh-inv .proc .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(32px,6vw,120px)}
#yh-inv .proc .head{position:sticky;top:var(--s8);align-self:start}
#yh-inv .proc h3{font-weight:900;font-size:clamp(40px,5vw,76px);letter-spacing:-.07em;line-height:1.15}
#yh-inv .proc h3.en{font-size:clamp(56px,7vw,112px);font-weight:900;letter-spacing:-.005em;line-height:.9}
#yh-inv .proc .head p{margin-top:var(--s4);font-size:clamp(18px,1.6vw,23px);font-weight:500;letter-spacing:-.045em;line-height:1.5}
#yh-inv .p-img{margin-top:var(--s6);aspect-ratio:3/2;border-radius:2px;overflow:hidden;background:var(--ink)}
#yh-inv .p-img img{width:100%;height:100%;object-fit:cover;object-position:52% 50%;display:block}
#yh-inv .steps{position:relative;list-style:none;display:grid;gap:12px}
#yh-inv .rail{position:absolute;left:31px;top:34px;bottom:34px;width:2px;background:var(--white)}
#yh-inv .rail i{position:absolute;inset:0 0 auto;height:0;background:var(--blue)}
#yh-inv .step{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3);align-items:center;background:var(--white);border-radius:6px;padding:var(--s4) var(--s4) var(--s4) 0;transition:transform .45s var(--ease)}
#yh-inv .step .n{display:grid;place-items:center}
#yh-inv .step .n b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 16px/1 "Archivo",sans-serif;background:var(--white);border:2px solid var(--line);color:var(--gray);transition:background .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease)}
#yh-inv .step.on .n b{background:var(--blue);border-color:var(--blue);color:var(--white)}
#yh-inv .step.now{transform:translateX(12px)}
#yh-inv .step h4{font-weight:900;font-size:clamp(18px,1.5vw,21px);letter-spacing:-.05em}
#yh-inv .step p{font-size:15px;line-height:1.6;margin-top:4px;color:#555;letter-spacing:-.03em}

/* 5 finale — top-down runner on pale ground; the camera slowly pulls back as you arrive */
#yh-inv .fin{background:var(--line);color:var(--ink)}
#yh-inv .fin .stage{position:relative;overflow:hidden;height:min(100vh,56.25vw);min-height:520px;background:#D7DCE1}
#yh-inv .fin .vis{position:absolute;inset:0}
#yh-inv .fin .vis img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block;transform:scale(var(--z,1.12));transform-origin:72% 40%;will-change:transform}
#yh-inv .fin .top{position:absolute;z-index:2;left:max(var(--margin),env(safe-area-inset-left,0px));top:clamp(32px,7vh,72px)}
#yh-inv .fin .top p{font-weight:900;font-size:clamp(56px,7.4vw,132px);letter-spacing:-.075em;line-height:1.12}
#yh-inv .fin .top p.en{font-size:clamp(72px,9.6vw,170px);letter-spacing:-.005em;line-height:.88}
#yh-inv .fin .top p i{display:inline-block;width:.17em;height:.17em;margin-left:.05em;border-radius:50%;background:var(--orange);vertical-align:baseline}
#yh-inv .cta{display:inline-flex;align-items:center;margin-top:var(--s5);height:60px;padding:0 34px;border-radius:999px;background:var(--orange);color:var(--white);text-decoration:none;font:800 17px/1 var(--kr);transition:transform .25s var(--ease)}
#yh-inv .cta:hover{transform:translateY(-3px)}
#yh-inv .fin .fine{position:absolute;z-index:2;left:max(var(--margin),env(safe-area-inset-left,0px));bottom:clamp(28px,6vh,64px);max-width:min(460px,38vw);font-size:13px;line-height:1.75;color:#3a3a3a}
#yh-inv .fin .fine b{display:block;color:var(--ink);font-size:15px;font-weight:800;margin-bottom:8px}
#yh-inv .fin .fine li{list-style:none;padding-left:10px;text-indent:-10px}
#yh-inv .fin .fine li:before{content:"·";margin-right:4px}

@media (max-width:860px){
  #yh-inv .marq{--unit:26px}
  #yh-inv .grid{display:block;position:relative;height:150vw}
  #yh-inv .tile{position:absolute}
  #yh-inv .p-face{left:0;top:0;width:60%;height:92vw}
  #yh-inv .p-hand{right:0;top:10vw;width:44%;height:52vw;z-index:1}
  #yh-inv .p-mtn{top:96vw;left:calc(-1*max(var(--margin),env(safe-area-inset-left,0px)));right:calc(-1*max(var(--margin),env(safe-area-inset-right,0px)));height:46vw}
  #yh-inv .p-legs{right:0;top:112vw;width:30%;height:38vw;z-index:1}
  #yh-inv .p-group{display:none}
  #yh-inv .p-face{--d:.2s}#yh-inv .p-hand{--d:.36s}#yh-inv .p-mtn{--d:.52s}#yh-inv .p-legs{--d:.66s}
  #yh-inv .word{font-size:30.5vw;white-space:normal;margin-top:-.3em}
  #yh-inv .word .w{white-space:nowrap}
  #yh-inv.play .grid{animation:none}
  #yh-inv .word .w{display:block}#yh-inv .word .w+.w{margin-left:0}
  #yh-inv .c-top,#yh-inv .c-bot,#yh-inv .proc .cols{grid-template-columns:minmax(0,1fr)}
  #yh-inv .c-bot{margin-top:var(--s7)}
  #yh-inv .proc .head{position:relative;top:0}
  #yh-inv .proc{padding-block:var(--s8)}
  #yh-inv .step{grid-template-columns:52px minmax(0,1fr);padding-right:var(--s3)}#yh-inv .rail{left:25px}
  #yh-inv .kv .ph{height:72vh}
  #yh-inv .kv .ph img{object-position:76% 40%}
  #yh-inv .kv h2{position:relative;top:auto;color:var(--white);font-size:13vw;padding-block:var(--s7) var(--s5)}
  #yh-inv .kv{display:flex;flex-direction:column-reverse}
  #yh-inv .p-img{aspect-ratio:16/10}
  #yh-inv .fin .stage{height:auto;min-height:0;overflow:visible;background:none;display:grid;grid-template-columns:minmax(0,1fr)}
  #yh-inv .fin .top{position:static;grid-row:1;grid-column:1;padding:var(--s7) 0 var(--s5)}
  #yh-inv .fin .top p{font-size:15vw}#yh-inv .fin .top p.en{font-size:20vw}
  #yh-inv .fin .vis{position:relative;inset:auto;grid-row:2;grid-column:1;aspect-ratio:4/5;overflow:hidden;margin-inline:calc(-1*max(var(--margin),env(safe-area-inset-left,0px)))}
  #yh-inv .fin .vis img{object-position:74% 50%}
  #yh-inv .fin .fine{position:static;grid-row:3;grid-column:1;max-width:none;padding-block:var(--s5) var(--s7)}
}
@media (prefers-reduced-motion:reduce){
  #yh-inv.js .tile,#yh-inv.js .tile img,#yh-inv.js .word .w,#yh-inv.js .lede,#yh-inv.js .kv h2 em,#yh-inv.js .kv .ph,#yh-inv .fin .vis img{clip-path:none;transform:none;opacity:1;animation:none!important}
  #yh-inv .marq .row{animation:none}
  #yh-inv .swap .lines b,#yh-inv .swap p{animation:none}
  #yh-inv,#yh-inv *{transition:none!important}
}

/* imweb: keep sticky scenes below the site header, and give the page its own box */
#yh-inv{position:relative;overflow-x:clip}
#yh-inv .letter .stick{top:var(--hd,0px);height:calc(100vh - var(--hd,0px))}
#yh-inv .proc .head{top:calc(var(--hd,0px) + 48px)}
</style>
