.modal_site_login .modal_article.login .over_h>a:hover,.widget.login .over_h>a:hover,.modal_site_login .modal_article.login .over_h>a:focus-visible,.widget.login .over_h>a:focus-visible{border-color:#002ACF;background:#F5F7FF;outline:none}

.widget.login::before{content:"참가신청과 1:1 문의는 로그인 후 이용할 수 있어요.\A처음이시면 아래 회원가입부터 진행해 주세요.";display:block;white-space:pre-line;margin:0 0 18px;padding:16px 18px;border-radius:10px;background:#F5F7FF;color:#212121;font-size:15px;font-weight:500;line-height:1.6;letter-spacing:-.02em}

<script>
(function(){
  if(window.__yhGuideGate)return;window.__yhGuideGate=1;
  function guest(){return typeof window.MEMBER_HASH==='string'&&window.MEMBER_HASH==='';}
  document.addEventListener('click',function(e){
    try{
      if(!guest()||/^\/entry-guide/.test(location.pathname))return;
      var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a)return;
      var u=new URL(a.getAttribute('href'),location.href);
      if(!(u.hostname===location.hostname||/(^|\.)yhitf\.co\.kr$/.test(u.hostname)))return;
      if(!/^\/registration\/?$/.test(u.pathname)||u.search)return;
      e.preventDefault();e.stopPropagation();location.href='/entry-guide';
    }catch(_){}
  },true);
})();
</script>
