<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:Pretendard,sans-serif;color:#141518;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
.w{max-width:1200px;margin:0 auto;padding:40px 24px 120px}
.cap{font-size:15px;font-weight:800;margin:48px 0 6px;color:#141518}
.cap span{font-weight:600;color:#7a808a;margin-left:8px}
.pf{position:relative;height:300px}
.pf svg{width:100%;height:100%;display:block;overflow:visible}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{border:0;border-radius:999px;padding:10px 18px;font:800 15px Pretendard;background:#f1f3f7;color:#7b808a;cursor:pointer}
.tabs button.on{background:#002ACF;color:#fff}
</style></head><body><div class="w">
<div class="tabs" id="tabs"><button data-k="15">15KM</button><button data-k="28" class="on">28KM</button></div>
<div id="out"></div>
</div>
<script>
var O='#FF6D07',INK='#141518';
var CPL={15:[['CP',3.5]],28:[['CP1',4.8],['CP2',15],['CP3',24]]},CUT={28:['CP2','4:30']};
var V=[
 ['A','등고선 + 스티플 믹스','능선을 위에서부터 여러 겹 등고선으로 내리고, 겹 사이를 점묘로 채움'],
 ['B','겹치는 능선 일러스트','뒤에 옅은 산 두 겹을 깔고, 앞 능선은 단색 면 — 판화·포스터 느낌'],
 ['E','능선 일러스트 + 망점','B의 겹친 산 위에, 앞 능선만 망점으로 톤 처리'],
 ['C','등고선만','제안받은 1번 정리형 — 면 대신 선 몇 겹으로 깊이감'],
 ['D','스티플만','제안받은 2번 정리형 — 세로 점묘가 아래로 흩어짐']];
function smooth(e,k){var n=e.length,o=[];for(var i=0;i<n;i++){var a=0,c=0;for(var j=Math.max(0,i-k);j<=Math.min(n-1,i+k);j++){a+=e[j];c++;}o.push(a/c);}return o;}
function path(pts){var s='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1);for(var i=1;i<pts.length;i++){var p0=pts[i-1],p1=pts[i],m=(p0[0]+p1[0])/2;s+='C'+m.toFixed(1)+','+p0[1].toFixed(1)+' '+m.toFixed(1)+','+p1[1].toFixed(1)+' '+p1[0].toFixed(1)+','+p1[1].toFixed(1);}return s;}
function draw(box,k,v){
 var d=YC_DATA[k],svg=document.createElementNS('http://www.w3.org/2000/svg','svg');box.appendChild(svg);
 var W=box.clientWidth,H=box.clientHeight,T=70,B=48,h=H-T-B,base=T+h,n=d.e.length,sm=smooth(smooth(d.e,3),3),mx=Math.max.apply(0,sm)*1.04;
 var X=function(i){return i/(n-1)*W},Y=function(m,f){return base-(m/mx)*h*(f==null?1:f)};
 var pts=function(f,dx){return sm.map(function(m,i){return[X(i)+(dx||0),Y(m,f)]})};
 var top=path(pts(1)),g='<defs>',uid='u'+Math.random().toString(36).slice(2,6);
 g+='<linearGradient id="'+uid+'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+O+'" stop-opacity=".14"/><stop offset="1" stop-color="'+O+'" stop-opacity=".02"/></linearGradient>';
 g+='<clipPath id="'+uid+'c"><path d="'+top+'L'+W+','+base+'L0,'+base+'Z"/></clipPath></defs>';
 var layers='';
 if(v==='A'||v==='C'){
  var L=v==='A'?[0.84,0.68,0.52,0.36,0.2]:[0.82,0.64,0.46,0.28,0.12];
  if(v==='C')layers+='<path d="'+top+'L'+W+','+base+'L0,'+base+'Z" fill="url(#'+uid+'g)"/>';
  if(v==='A'){var st=3.4,dots='';var bands=[1].concat(L);for(var x=st/2;x<W;x+=st){var i=Math.round(x/W*(n-1));for(var b=0;b<bands.length;b++){var y0=Y(sm[i],bands[b]),y1=Y(sm[i],bands[b+1]||0),dd=(b%2?0:st/2);for(var y=y0+1.6+dd;y<y1-1;y+=st){var t=(y-y0)/Math.max(1,y1-y0);var r=1.05*(1-t*0.75);if(r>.25)dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'"/>';}}}
   layers+='<g fill="'+O+'" opacity="'+.38+'" clip-path="url(#'+uid+'c)">'+dots+'</g>';}
  L.forEach(function(f,j){layers+='<path d="'+path(pts(f))+'" fill="none" stroke="'+O+'" stroke-width="1" opacity="'+(0.55-j*0.08).toFixed(2)+'"/>';});
 }
 if(v==='B'||v==='E'){
  g=g.replace('</defs>','<clipPath id="'+uid+'v"><rect x="0" y="0" width="'+W+'" height="'+base+'"/></clipPath></defs>');
  var far=smooth(smooth(d.e,9),9),mid=smooth(smooth(d.e,6),6);
  var sil=function(arr,f,dx){var q=arr.map(function(m,i){return[X(i)+dx,Y(m,f)]});return path(q)+'L'+(W+200)+','+base+'L-200,'+base+'Z';};
  layers+='<g clip-path="url(#'+uid+'v)"><path d="'+sil(far,1.12,-110)+'" fill="#FFF1E7"/><path d="'+sil(mid,0.98,90)+'" fill="#FFE2CC"/></g>';
  layers+='<path d="'+top+'L'+W+','+base+'L0,'+base+'Z" fill="'+(v==='B'?'#FFC79F':'#FFF6F0')+'"/>';
  if(v==='E'){var st=3.2,dots='';for(var x=st/2;x<W;x+=st){var i=Math.round(x/W*(n-1)),y0=Y(sm[i]);var row=0;for(var y=y0+1.5;y<base;y+=st,row++){var t=(y-y0)/(base-y0+1);var r=1.2*(1-t*0.85);if(r>.25)dots+='<circle cx="'+(x+(row%2)*st/2).toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r.toFixed(2)+'"/>';}}
   layers+='<g fill="'+O+'" opacity=".55" clip-path="url(#'+uid+'c)">'+dots+'</g>';}
 }
 if(v==='D'){var st=3.2,dots='';for(var x=st/2;x<W;x+=st){var i=Math.round(x/W*(n-1)),y0=Y(sm[i]);for(var y=y0+2;y<base;y+=2.6){var t=(y-y0)/(base-y0+1);if(Math.random()<1-t*0.95)dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r=".75"/>';}}layers+='<g fill="'+O+'" opacity=".7">'+dots+'</g>';}
 g+=layers;
 g+='<line x1="0" x2="'+W+'" y1="'+base+'" y2="'+base+'" stroke="'+INK+'" stroke-width="1.2"/>';
 g+='<path d="'+top+'" fill="none" stroke="'+O+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
 var im=0;for(var i=1;i<n;i++)if(sm[i]>sm[im])im=i;var px=X(im),py=Y(sm[im]),tp=Math.round(Math.max.apply(0,d.e)),pk=(im/(n-1)*d.km).toFixed(1);
 g+='<line x1="'+px+'" x2="'+px+'" y1="'+(py-8)+'" y2="'+(T-58)+'" stroke="'+INK+'" stroke-width="1.2"/><circle cx="'+px+'" cy="'+py+'" r="4.5" fill="'+INK+'"/>';
 g+='<text x="'+(px-10)+'" y="'+(T-28)+'" text-anchor="end" font-size="44" font-weight="900" fill="'+INK+'" letter-spacing="-2">'+tp+'<tspan font-size="20" dx="2">m</tspan></text><text x="'+(px-10)+'" y="'+(T-8)+'" text-anchor="end" font-size="13" font-weight="700" fill="#8a8f99">최고점 · '+pk+'km</text>';
 for(var q=5;q<d.km-1.5;q+=5)g+='<line x1="'+(q/d.km*W)+'" x2="'+(q/d.km*W)+'" y1="'+base+'" y2="'+(base+5)+'" stroke="'+INK+'"/><text x="'+(q/d.km*W)+'" y="'+(base+22)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#8a8f99">'+q+'</text>';
 g+='<text x="0" y="'+(base+22)+'" font-size="13" font-weight="800" fill="'+INK+'">START</text><text x="'+W+'" y="'+(base+22)+'" text-anchor="end" font-size="13" font-weight="800" fill="'+INK+'">'+d.km.toFixed(1)+'<tspan font-size="11"> km</tspan></text>';
 (CPL[k]||[]).forEach(function(c){var x=c[1]/d.km*W,i=Math.round(c[1]/d.km*(n-1)),y=Y(sm[i]),cut=CUT[k]&&CUT[k][0]===c[0];
  g+='<line x1="'+x+'" x2="'+x+'" y1="'+y+'" y2="'+base+'" stroke="'+(cut?O:INK)+'" stroke-width="1" stroke-dasharray="3 3" opacity="'+(cut?.9:.5)+'"/><circle cx="'+x+'" cy="'+y+'" r="5.5" fill="#fff" stroke="'+O+'" stroke-width="2.5"/>';
  if(cut){var lab=c[0]+' · 컷오프 '+CUT[k][1],w=lab.length*9+28;g+='<rect x="'+(x-w/2)+'" y="'+(base+8)+'" width="'+w+'" height="28" rx="14" fill="'+O+'"/><text x="'+x+'" y="'+(base+27)+'" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">'+lab+'</text>';}
  else{var w=c[0].length*9+22;g+='<rect x="'+(x-w/2)+'" y="'+(y-46)+'" width="'+w+'" height="26" rx="13" fill="#fff" stroke="'+INK+'" stroke-width="1.2"/><text x="'+x+'" y="'+(y-28.5)+'" text-anchor="middle" font-size="12.5" font-weight="800" fill="'+INK+'">'+c[0]+'</text>';}});
 svg.innerHTML=g;}
function render(k){var o=document.getElementById('out');o.innerHTML='';V.forEach(function(v){var c=document.createElement('div');c.innerHTML='<div class="cap">'+v[0]+'. '+v[1]+'<span>'+v[2]+'</span></div><div class="pf"></div>';o.appendChild(c);draw(c.querySelector('.pf'),k,v[0]);});
 document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',+b.dataset.k===k)});}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){render(+b.dataset.k)}});
render(28);
</script></body></html>
