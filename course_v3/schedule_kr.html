.ys-root tr{display:grid;grid-template-columns:76px 1fr;column-gap:12px;padding:14px 0;border-bottom:1px solid #e6e8ec}

.ys-root td.t{grid-row:span 2;font-size:22px}

.ys-root td.p{font-size:14px;margin-top:2px}
}
