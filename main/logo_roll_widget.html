<div id="yh-roll" aria-label="주최·주관·후원"><div class="mask"><div class="track"></div></div></div>

#yh-roll{--unit:30px;--speed:45;background:#fff;padding:22px 0}
#yh-roll .mask{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
#yh-roll .track{display:flex;align-items:center;width:max-content;will-change:transform}
#yh-roll .item{flex:none;display:flex;align-items:center;padding:0 clamp(28px,3.4vw,52px)}
#yh-roll img{display:block;width:auto;height:var(--h)}
#yh-roll .track.run{animation:yhRoll var(--dur) linear infinite}
#yh-roll:hover .track.run{animation-play-state:paused}
@keyframes yhRoll{to{transform:translateX(-50%)}}
@media(max-width:768px){#yh-roll{--unit:24px;padding:16px 0}#yh-roll .mask{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 82%,transparent 100%)}}
