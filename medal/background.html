<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medal Background</title>
<style>
:root{--blue:#002ACF;--orange:#FF6D07;--ink:#212121;--line:#EAEAEA}
html,body{margin:0;height:100%;background:#fff;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
.slot{position:fixed;left:50%;top:48%;width:min(46vh,62vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px dashed rgba(33,33,33,.28);display:flex;align-items:center;justify-content:center;color:rgba(33,33,33,.5);font-size:14px;pointer-events:none}
body.b .slot{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}
.tabs{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(33,33,33,.55);backdrop-filter:blur(8px)}
.tabs button{appearance:none;border:0;cursor:pointer;height:38px;padding:0 18px;border-radius:999px;background:transparent;color:#fff;font:700 14px/1 inherit}
.tabs button[aria-pressed="true"]{background:var(--orange)}
.tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="slot">메달 자리</div>
<div class="tabs" role="group" aria-label="배경 시안">
  <button type="button" data-v="0" aria-pressed="true">A · 라이트</button>
  <button type="button" data-v="1" aria-pressed="false">B · 블루</button>
</div>
<script>
(function(){
var cv=document.getElementById('bg'),gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false});
var Q=new URLSearchParams(location.search),V=+(Q.get('v')||0),FT=Q.has('t')?+Q.get('t'):null;
var vs='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
var fs=`precision highp float;varying vec2 v;uniform float t;uniform vec2 res;uniform float mode;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fb(vec2 p){float s=0.,a=.5;for(int i=0;i<4;i++){s+=a*n(p);p*=2.02;a*=.5;}return s;}
vec3 L(vec3 c){return pow(c,vec3(2.2));}
/* one soft ribbon: a wavy band, blurred hard along its flow (motion blur) and crisp across it */
float ribbon(vec2 q,float off,float amp,float freq,float w,float ph){
  float y=off+amp*sin(q.x*freq+ph)+amp*.45*sin(q.x*freq*2.3-ph*1.4);
  float d=abs(q.y-y);
  return exp(-d*d/(w*w));
}
void main(){
  vec2 p=(v-.5)*vec2(res.x/res.y,1.);
  float an=.42;mat2 R=mat2(cos(an),-sin(an),sin(an),cos(an));
  vec2 q=R*p;                                     /* q.x runs up-right */
  /* eased speed: surges, then glides (never constant) */
  float tt=t*.55+.35*sin(t*.9)+.18*sin(t*2.1+1.);
  vec2 qs=q;qs.x-=tt*.25;
  float st=fb(vec2(qs.x*1.2-tt*.8,q.y*26.));      /* fine speed streaks */
  float st2=fb(vec2(qs.x*.6-tt*1.3,q.y*9.+4.));
  vec3 white=L(vec3(1.)),grey=L(vec3(.918)),blue=L(vec3(0.,.165,.812)),org=L(vec3(1.,.427,.027)),navy=L(vec3(0.,.07,.42)),ink=L(vec3(.13));
  vec3 c;
  if(mode<.5){
    /* A: light — white field, a blue ribbon sweeping in from the low left, an orange one from the top right */
    c=mix(white,grey,smoothstep(.2,1.2,length(p*vec2(.8,1.))));
    float b1=ribbon(q+vec2(0.,.0),-.30,.10,2.2,.13,tt*1.1)*(.65+.55*st);
    float b2=ribbon(q,-.47,.07,2.8,.06,tt*1.6+1.)*(.5+.7*st2);
    float o1=ribbon(q,.30,.09,2.0,.11,-tt*1.2+2.)*(.65+.55*st2);
    float o2=ribbon(q,.47,.06,3.1,.05,-tt*1.7)*(.5+.7*st);
    vec3 sky=L(vec3(.62,.80,1.));c=mix(c,sky,clamp(b1*1.6,0.,1.)*.55);c=mix(c,blue,smoothstep(.35,1.,b1));c=mix(c,sky,clamp(b2*.7,0.,1.));c=mix(c,blue,smoothstep(.55,1.,b2)*.8);
    vec3 peach=L(vec3(1.,.82,.66));c=mix(c,peach,clamp(o1*1.6,0.,1.)*.55);c=mix(c,org,smoothstep(.35,1.,o1));c=mix(c,peach,clamp(o2*.7,0.,1.));c=mix(c,org,smoothstep(.55,1.,o2)*.8);
    /* thin white speed lines over everything */
    c=mix(c,white,smoothstep(.62,.8,st)*.55);
    /* clear light in the middle for the medal */
    c=mix(c,white,.75*exp(-dot(p,p)*7.));
  }else{
    /* B: blue — deep K-Blue with orange and white light trails, glow behind the medal */
    c=mix(blue,navy,smoothstep(-.2,1.1,length(p-vec2(-.4,-.5))));
    float o1=ribbon(q,.26,.08,2.2,.07,-tt*1.3)*(.4+.9*st);
    float o2=ribbon(q,-.34,.06,2.7,.045,tt*1.5+1.)*(.3+.9*st2);
    float w1=ribbon(q,.08,.12,1.6,.03,tt*1.1+2.)*(.3+1.*st);
    float w2=ribbon(q,-.15,.09,2.5,.02,-tt*1.8)*(.3+1.*st2);
    c=mix(c,org,clamp(o1,0.,1.));c=mix(c,L(vec3(1.,.62,.3)),clamp(o2*.8,0.,1.));
    c=mix(c,white,clamp(w1*.8+w2*.7,0.,1.));
    c+=L(vec3(.55,.68,1.))*.32*exp(-dot(p,p)*5.);
    c=mix(c,white,smoothstep(.7,.86,st)*.35);
  }
  c+=(h(floor(v*res)+floor(t*24.))-.5)*.012;     /* grain */
  gl_FragColor=vec4(pow(max(c,0.),vec3(1./2.2)),1.);
}`;
function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
var uT=gl.getUniformLocation(pr,'t'),uR=gl.getUniformLocation(pr,'res'),uM=gl.getUniformLocation(pr,'mode');
function size(){var d=Math.min(devicePixelRatio||1,1.5);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height)}
addEventListener('resize',size);size();
var btns=[].slice.call(document.querySelectorAll('.tabs button'));
function setV(i){V=i;document.body.classList.toggle('b',i===1);btns.forEach(function(x){x.setAttribute('aria-pressed',+x.dataset.v===i)})}
btns.forEach(function(x){x.addEventListener('click',function(){setV(+x.dataset.v)})});setV(V);
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function f(now){var t=FT!==null?FT:(reduce?4:(now-t0)/1000);gl.uniform1f(uT,t);gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uM,V);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);if(FT===null)requestAnimationFrame(f)}
requestAnimationFrame(f);
})();
</script>
</body>
</html>
