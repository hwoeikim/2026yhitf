<title>THE INVITED</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 1 blue hero: image grid + condensed wordmark → 2 sticky dot map: world → frame on Korea → zoom to Hanam → invitation quote → logos
   3 key visual → criteria (ITRA index + scores; EN tiers switch the benefit block) → 4 steps with filling rail → 5 finale poster */
:root{
  --blue:#002ACF; --orange:#FF6D07; --white:#FFFFFF; --ink:#212121; --gray:#999999; --line:#EAEAEA;
  --kr:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --hook:"Black Han Sans","Noto Sans KR",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --margin:clamp(16px,4vw,48px);
  --s3:16px;--s4:24px;--s5:32px;--s6:48px;--s7:64px;--s8:96px;--s9:160px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--ink);font-family:var(--kr);letter-spacing:-.03em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
.gut{padding-left:max(var(--margin),env(safe-area-inset-left,0px));padding-right:max(var(--margin),env(safe-area-inset-right,0px))}
.wide{max-width:1400px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.en{font-family:"Archivo","Noto Sans KR",sans-serif;font-stretch:62%;font-variation-settings:"wdth" 62;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:.88}
.ph{position:relative;overflow:hidden;background:var(--line)}
.ph>i{position:absolute;left:14px;bottom:12px;right:14px;font-style:normal;font-size:12px;line-height:1.45;color:var(--gray);font-weight:500}
.dark .ph{background:rgba(255,255,255,.07)}
.dark .ph>i{color:rgba(255,255,255,.4)}

/* prototype-only language switch */
.lang{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;display:flex;background:var(--ink);border-radius:999px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lang button{all:unset;cursor:pointer;font:700 12px/1 var(--kr);padding:8px 13px;border-radius:999px;color:var(--gray)}
.lang button[aria-pressed="true"]{background:var(--white);color:var(--ink)}

/* 1 hero — five photos slide in from different sides, then THE INVITED. lifts over them */
.hero{background:var(--blue);color:var(--white);padding-block:var(--s7);position:relative;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(58px,6.6vw,100px);gap:var(--s3)}
.tile{position:relative;overflow:hidden;background:rgba(255,255,255,.1)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.p-face{grid-column:1/5;grid-row:1/6}.p-face img{object-position:62% 40%}
.p-mtn{grid-column:5/10;grid-row:1/4}.p-mtn img{object-position:38% 62%}
.p-hand{grid-column:10/13;grid-row:1/3}.p-hand img{object-position:40% 42%}
.p-legs{grid-column:10/13;grid-row:3/6}.p-legs img{object-position:45% 55%}
.p-group{grid-column:5/10;grid-row:4/6}.p-group img{object-position:50% 42%}
.word{position:relative;z-index:2;margin-top:-.6em;font-size:clamp(92px,19.6vw,300px);white-space:nowrap;pointer-events:none;letter-spacing:-.015em}
.word .w{display:inline-block;position:relative}
.word .w+.w{margin-left:.14em}
.dot{display:inline-block;width:.15em;height:.15em;margin-left:.04em;border-radius:50%;background:var(--orange);vertical-align:baseline}
.lede{margin-top:var(--s6)}
.lede .kr strong{display:block;font-weight:900;font-size:clamp(20px,1.9vw,28px);letter-spacing:-.055em;line-height:1.35}
.lede .kr span{display:block;margin-top:10px;font-size:clamp(26px,3vw,46px);line-height:1.2;font-weight:900;letter-spacing:-.055em;color:var(--orange)}

.p-mtn{--d:.2s}.p-face{--d:.36s}.p-hand{--d:.52s}.p-group{--d:.68s}.p-legs{--d:.82s}
.js .from-l{clip-path:inset(0 100% 0 0)}.js .from-l img{transform:translateX(-14%) scale(1.12)}
.js .from-r{clip-path:inset(0 0 0 100%)}.js .from-r img{transform:translateX(14%) scale(1.12)}
.js .from-b{clip-path:inset(100% 0 0 0)}.js .from-b img{transform:translateY(14%) scale(1.12)}
.js .from-t{clip-path:inset(0 0 100% 0)}.js .from-t img{transform:translateY(-14%) scale(1.12)}
.play .tile{animation:reveal .8s var(--ease) var(--d) forwards,dim 1s var(--ease) 1.3s forwards}
.play .tile img{animation:settle 1.1s var(--ease) var(--d) forwards}
.play .p-legs{animation-duration:.5s,1s}.play .p-legs img{animation-duration:.7s}
.play .grid{animation:recede 1.2s var(--ease) 1.3s forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes settle{to{transform:none}}
@keyframes dim{to{filter:brightness(.66)}}
@keyframes recede{to{transform:scale(.975)}}
.js .word .w{clip-path:inset(0 0 100% 0);transform:translateY(22%)}
.js .lede{opacity:0}
.play .word .w{animation:lift 1.2s var(--ease) 1.25s forwards}
.play .word .w+.w{animation-delay:1.36s}
.play .lede{animation:up 1s var(--ease) 1.75s forwards}
@keyframes lift{to{clip-path:inset(-10% -10% -12% -10%);transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* 2 map + invitation */
.letter{position:relative;height:340vh;background:var(--white)}
.letter .stick{position:sticky;top:0;height:100vh;overflow:hidden}
#globe{position:absolute;inset:0;width:100%;height:100%}
.note{position:absolute;left:0;right:0;top:0;padding:13vh var(--margin) 10vh;text-align:center;background:linear-gradient(#fff 62%,rgba(255,255,255,0))}
.note q{display:block;quotes:none;font-weight:900;font-size:clamp(26px,3.6vw,52px);line-height:1.3;letter-spacing:-.065em;text-wrap:balance}
.note q em{font-style:normal;color:var(--orange)}
.note q.en{font-size:clamp(40px,6vw,92px);line-height:.92;letter-spacing:-.005em}
.marq{padding-block:var(--s7)}
.marq .track{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.marq .row{display:flex;gap:var(--s7);width:max-content;animation:roll 38s linear infinite}
.marq{--unit:34px}
.marq .row{align-items:center}
.marq .logo{height:calc(var(--unit) * var(--h));width:calc(var(--unit) * var(--h) * var(--r));flex:none}
.marq .logo img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes roll{to{transform:translateX(-50%)}}

/* 3 key visual */
.kv{position:relative;background:var(--ink);color:var(--white)}
.kv .ph{height:min(88vh,840px);background:#C9D0D8}
.kv .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 34%;display:block}
.kv h2{position:absolute;left:0;right:0;top:8vh;color:var(--white);font-size:clamp(64px,9.2vw,168px)}
.kv h2 span{display:block;overflow:hidden;padding-bottom:.04em}
.kv h2 em{display:block;font-style:normal}
.js .kv h2 em{transform:translateY(105%)}
.kv.in h2 em{transform:none;transition:transform 1.1s var(--ease)}
.kv.in h2 span+span em{transition-delay:.12s}.kv.in h2 span+span+span em{transition-delay:.24s}
.js .kv .ph{clip-path:inset(10% 5% 10% 5%)}
.kv.in .ph{clip-path:inset(0);transition:clip-path 1.4s var(--ease)}

/* criteria */
.crit{background:var(--blue);color:var(--white);padding-block:var(--s8) var(--s9)}
.c-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--s6);align-items:start}
.c-l h3{font-size:clamp(18px,1.5vw,22px);font-weight:700;letter-spacing:-.045em}
.c-l .idx{margin-top:var(--s4);font-size:clamp(64px,8vw,128px);color:var(--orange)}
.c-l p.d{margin-top:var(--s4);font-size:clamp(16px,1.3vw,19px);line-height:1.75;color:rgba(255,255,255,.82)}
.scores{display:grid}
.scores .hd,.srow{display:grid;grid-template-columns:var(--sc-cols);align-items:end;column-gap:var(--s5)}
.scores .hd{padding-bottom:var(--s3);font-size:clamp(15px,1.2vw,18px);font-weight:700}
.scores .hd span:first-child:empty{display:block}
.srow{all:unset;display:grid;grid-template-columns:var(--sc-cols);align-items:center;column-gap:var(--s5);padding-block:6px;cursor:default}
.multi .srow{cursor:pointer;border-top:1px solid rgba(255,255,255,.14);padding-block:var(--s3)}
.multi .srow:last-child{border-bottom:1px solid rgba(255,255,255,.14)}
.srow .tn{font-size:clamp(28px,2.6vw,40px)}
.srow .tn small{display:block;margin-top:8px;font:500 13px/1.3 var(--kr);text-transform:none;letter-spacing:0;color:var(--gray)}
.srow .n{font-size:clamp(84px,10vw,160px);color:var(--orange);transition:color .35s var(--ease),transform .5s var(--ease);transform-origin:left bottom}
.multi .srow .n{font-size:clamp(56px,6.2vw,104px)}
.multi .srow:not([aria-pressed="true"]) .n{color:rgba(255,255,255,.22)}
.multi .srow:not([aria-pressed="true"]) .tn{color:rgba(255,255,255,.4)}
.multi .srow:not([aria-pressed="true"]):hover .n{color:rgba(255,255,255,.5)}
.multi .srow .tn{transition:color .35s var(--ease)}
.c-bot{margin-top:var(--s8);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:var(--s6);align-items:center}
.c-img{aspect-ratio:4/5;max-height:86vh;border-radius:2px;background:#000}
.c-img img,.c-img .shine{position:absolute;inset:0;width:100%;height:100%}
.c-img img{object-fit:cover;object-position:50% 46%;display:block}
/* one band of light slides down the woven ribbon as the section scrolls; the photo itself is the mask, so the black backdrop never lights up */
.c-img .shine{--p:-.3;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(172deg,transparent calc((var(--p) - .13) * 100%),rgba(255,240,226,.9) calc(var(--p) * 100%),transparent calc((var(--p) + .13) * 100%));
  -webkit-mask:url(img/ribbon.jpg) 50% 46%/cover no-repeat;mask:url(img/ribbon.jpg) 50% 46%/cover no-repeat luminance}
.ben h4{font-size:clamp(17px,1.4vw,20px);font-weight:700;letter-spacing:-.045em;color:var(--orange)}
.ben .big{margin-top:var(--s3);font-weight:900;font-size:clamp(34px,3.4vw,54px);letter-spacing:-.065em;line-height:1.15}
.ben .big em{font-style:normal;color:var(--orange)}
.ben .lines{margin-top:var(--s4);display:grid;gap:.06em}
.ben .lines span{display:block;font-size:clamp(52px,6vw,100px);overflow:hidden}
.ben .lines span b{display:block;font-weight:inherit}
.ben .lines span:first-child b{color:var(--orange)}
.ben p{margin-top:var(--s5);font-size:clamp(16px,1.3vw,19px);line-height:1.75;color:rgba(255,255,255,.82);max-width:34em}
.swap .lines b{animation:rise .6s var(--ease) both}
.swap .lines span:nth-child(2) b{animation-delay:.06s}.swap .lines span:nth-child(3) b{animation-delay:.12s}
.swap p{animation:up .6s var(--ease) .1s both}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}

/* 4 process */
.proc{background:var(--line);padding-block:var(--s9)}
.proc .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(32px,6vw,120px)}
.proc .head{position:sticky;top:var(--s8);align-self:start}
.proc h3{font-weight:900;font-size:clamp(40px,5vw,76px);letter-spacing:-.07em;line-height:1.15}
.proc h3.en{font-size:clamp(56px,7vw,112px);font-weight:900;letter-spacing:-.005em;line-height:.9}
.proc .head p{margin-top:var(--s4);font-size:clamp(18px,1.6vw,23px);font-weight:500;letter-spacing:-.045em;line-height:1.5}
.p-img{margin-top:var(--s6);aspect-ratio:3/2;border-radius:2px;overflow:hidden;background:var(--ink)}
.p-img img{width:100%;height:100%;object-fit:cover;object-position:52% 50%;display:block}
.steps{position:relative;list-style:none;display:grid;gap:12px}
.rail{position:absolute;left:31px;top:34px;bottom:34px;width:2px;background:var(--white)}
.rail i{position:absolute;inset:0 0 auto;height:0;background:var(--blue)}
.step{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3);align-items:center;background:var(--white);border-radius:6px;padding:var(--s4) var(--s4) var(--s4) 0;transition:transform .45s var(--ease)}
.step .n{display:grid;place-items:center}
.step .n b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 16px/1 "Archivo",sans-serif;background:var(--white);border:2px solid var(--line);color:var(--gray);transition:background .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease)}
.step.on .n b{background:var(--blue);border-color:var(--blue);color:var(--white)}
.step.now{transform:translateX(12px)}
.step h4{font-weight:900;font-size:clamp(18px,1.5vw,21px);letter-spacing:-.05em}
.step p{font-size:15px;line-height:1.6;margin-top:4px;color:#555;letter-spacing:-.03em}

/* 5 finale — top-down runner on pale ground; the camera slowly pulls back as you arrive */
.fin{background:var(--line);color:var(--ink)}
.fin .stage{position:relative;overflow:hidden;height:min(100vh,56.25vw);min-height:520px;background:#D7DCE1}
.fin .vis{position:absolute;inset:0}
.fin .vis img{width:100%;height:100%;object-fit:cover;object-position:62% 50%;display:block;transform:scale(var(--z,1.12));transform-origin:72% 40%;will-change:transform}
.fin .top{position:absolute;z-index:2;left:max(var(--margin),env(safe-area-inset-left,0px));top:clamp(32px,7vh,72px)}
.fin .top p{font-weight:900;font-size:clamp(56px,7.4vw,132px);letter-spacing:-.075em;line-height:1.12}
.fin .top p.en{font-size:clamp(72px,9.6vw,170px);letter-spacing:-.005em;line-height:.88}
.fin .top p i{display:inline-block;width:.17em;height:.17em;margin-left:.05em;border-radius:50%;background:var(--orange);vertical-align:baseline}
.cta{display:inline-flex;align-items:center;margin-top:var(--s5);height:60px;padding:0 34px;border-radius:999px;background:var(--orange);color:var(--white);text-decoration:none;font:800 17px/1 var(--kr);transition:transform .25s var(--ease)}
.cta:hover{transform:translateY(-3px)}
.fin .fine{position:absolute;z-index:2;left:max(var(--margin),env(safe-area-inset-left,0px));bottom:clamp(28px,6vh,64px);max-width:min(460px,38vw);font-size:13px;line-height:1.75;color:#3a3a3a}
.fin .fine b{display:block;color:var(--ink);font-size:15px;font-weight:800;margin-bottom:8px}
.fin .fine li{list-style:none;padding-left:10px;text-indent:-10px}
.fin .fine li:before{content:"·";margin-right:4px}

@media (max-width:860px){
  .marq{--unit:26px}
  .grid{display:block;position:relative;height:150vw}
  .tile{position:absolute}
  .p-face{left:0;top:0;width:60%;height:92vw}
  .p-hand{right:0;top:10vw;width:44%;height:52vw;z-index:1}
  .p-mtn{top:96vw;left:calc(-1*max(var(--margin),env(safe-area-inset-left,0px)));right:calc(-1*max(var(--margin),env(safe-area-inset-right,0px)));height:46vw}
  .p-legs{right:0;top:112vw;width:30%;height:38vw;z-index:1}
  .p-group{display:none}
  .p-face{--d:.2s}.p-hand{--d:.36s}.p-mtn{--d:.52s}.p-legs{--d:.66s}
  .word{font-size:30.5vw;white-space:normal;margin-top:-.3em}
  .word .w{white-space:nowrap}
  .play .grid{animation:none}
  .word .w{display:block}.word .w+.w{margin-left:0}
  .c-top,.c-bot,.proc .cols{grid-template-columns:minmax(0,1fr)}
  .c-bot{margin-top:var(--s7)}
  .proc .head{position:relative;top:0}
  .proc{padding-block:var(--s8)}
  .step{grid-template-columns:52px minmax(0,1fr);padding-right:var(--s3)}.rail{left:25px}
  .kv .ph{height:72vh}
  .kv .ph img{object-position:76% 40%}
  .kv h2{position:relative;top:auto;color:var(--white);font-size:13vw;padding-block:var(--s7) var(--s5)}
  .kv{display:flex;flex-direction:column-reverse}
  .p-img{aspect-ratio:16/10}
  .fin .stage{height:auto;min-height:0;overflow:visible;background:none;display:grid;grid-template-columns:minmax(0,1fr)}
  .fin .top{position:static;grid-row:1;grid-column:1;padding:var(--s7) 0 var(--s5)}
  .fin .top p{font-size:15vw}.fin .top p.en{font-size:20vw}
  .fin .vis{position:relative;inset:auto;grid-row:2;grid-column:1;aspect-ratio:4/5;overflow:hidden;margin-inline:calc(-1*max(var(--margin),env(safe-area-inset-left,0px)))}
  .fin .vis img{object-position:74% 50%}
  .fin .fine{position:static;grid-row:3;grid-column:1;max-width:none;padding-block:var(--s5) var(--s7)}
}
@media (prefers-reduced-motion:reduce){
  .js .tile,.js .tile img,.js .word .w,.js .lede,.js .kv h2 em,.js .kv .ph,.fin .vis img{clip-path:none;transform:none;opacity:1;animation:none!important}
  .marq .row{animation:none}
  .swap .lines b,.swap p{animation:none}
  *{transition:none!important}
}
</style>

<script>
(function(){
var root=document.documentElement;root.classList.add('js');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
requestAnimationFrame(function(){requestAnimationFrame(function(){root.classList.add('play')})});

var T={

var MAPS=__MAPS__;
function bits(str,n){var raw=atob(str),a=new Uint8Array(n);for(var i=0;i<n;i++)a[i]=(raw.charCodeAt(i>>3)>>(7-(i&7)))&1;return a}

var cv=$('globe'),cx=cv.getContext('2d'),dpr=1,cw=0,ch=0,prog=0;

    ISL=[];
function clamp(x){return x<0?0:x>1?1:x}

function draw(){
  if(!cw)return;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,cw,ch);
  /* one continuous zoom from the world to Hanam; the quote is already up while the world is in view */
  var zp=eio(clamp((prog-.06)/.82));
  var z0=Math.min(cw/380,ch/170),z1=Math.min(cw/11,ch/15);
  var z=z0*Math.pow(z1/z0,zp);
  /* zoom toward Hanam: its screen point glides from where it sits on the world map to its final spot */
  var sx0=cw/2+(HAN.lon-12)*z0,sy0=ch*.6-(HAN.lat-8)*z0,sx1=cw*(cw<700?.36:.47),sy1=ch*(cw<700?.5:.55);
  var SX=sx0+(sx1-sx0)*zp,SY=sy0+(sy1-sy0)*zp;
  function X(lon){return SX+(lon-HAN.lon)*z}function Y(lat){return SY-(lat-HAN.lat)*z}

  var span=cw/z,mix=clamp((78-span)/30);
  function layer(m,alpha,cap){
    if(alpha<=.01)return;
    var dLon=(m.lon1-m.lon0)/m.W,dLat=(m.lat1-m.lat0)/m.H,r=Math.max(.7,Math.min(cap,dLon*z*.36));
    var x0=Math.max(0,Math.floor(((cLon-cw/2/z)-m.lon0)/dLon)-1),x1=Math.min(m.W,Math.ceil(((cLon+cw/2/z)-m.lon0)/dLon)+1);
    var land=new Path2D(),kor=new Path2D();
    for(var y=0;y<m.H;y++){var sy=Y(m.lat1-(y+.5)*dLat);if(sy<-6||sy>ch+6)continue;
      for(var x=x0;x<x1;x++){var i=y*m.W+x,k=m.K[i];if(!k&&!m.L[i])continue;var sx=X(m.lon0+(x+.5)*dLon);
        var P=k?kor:land;P.moveTo(sx+r,sy);P.arc(sx,sy,r,0,6.2832)}}
    cx.globalAlpha=alpha*.5;cx.fillStyle='#999999';cx.fill(land);
    cx.fill(kor);cx.globalAlpha=1;
  }
  layer(W0,1-mix,6);layer(R0,mix,3.4);
  /* frame on Korea grows with the camera, then fades */
  var fa=.9*(1-clamp((zp-.6)/.25));
  if(fa>0){var x1=X(BOX.l),x2=X(BOX.r),y1=Y(BOX.t),y2=Y(BOX.b),L=Math.min(22,(x2-x1)*.3);
    cx.strokeStyle='rgba(255,109,7,'+fa+')';cx.lineWidth=1.5;cx.beginPath();
    [[x1,y1,1,1],[x2,y1,-1,1],[x1,y2,1,-1],[x2,y2,-1,-1]].forEach(function(c){cx.moveTo(c[0]+c[2]*L,c[1]);cx.lineTo(c[0],c[1]);cx.lineTo(c[0],c[1]+c[3]*L)});cx.stroke()}
  var la=clamp((zp-.72)/.2),fs=Math.round(Math.max(13,Math.min(16,cw/90)));
  /* Hanam pin */

  cx.strokeStyle='rgba(255,109,7,'+(.25+.35*zp)+')';cx.lineWidth=1;cx.beginPath();cx.arc(px,py,pr+8+zp*20,0,6.2832);cx.stroke();
  cx.fillStyle='#FF6D07';cx.beginPath();cx.arc(px,py,pr,0,6.2832);cx.fill();
  if(la>0){cx.globalAlpha=la;cx.fillStyle='#212121';cx.textBaseline='middle';cx.font='900 '+Math.round(Math.max(18,Math.min(28,cw/52)))+'px Archivo,sans-serif';
    try{cx.fontStretch='ultra-condensed'}catch(e){}var tx=px-cx.measureText('HANAM, KOREA').width-pr-14;cx.lineJoin='round';cx.lineWidth=6;cx.strokeStyle='#FFFFFF';cx.strokeText('HANAM, KOREA',tx,py);cx.fillText('HANAM, KOREA',tx,py);cx.globalAlpha=1}

}
